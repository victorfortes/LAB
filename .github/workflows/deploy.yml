# Publicação alternativa no Cloudflare Pages (use se a build do próprio Pages não tiver Python).
# Requer segredos do repositório: CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID e variáveis SUPABASE_URL / SUPABASE_ANON_KEY.
# NÃO TESTADO em ambiente real (depende de contas do escritório).
name: deploy
on: { workflow_dispatch: {} }
permissions: { contents: read }
jobs:
  publicar:
    runs-on: ubuntu-latest
    environment: producao
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: python3 scripts/build.py
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
      - run: npx wrangler@3 pages deploy dist --project-name=nga-gerador-relatorios
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
